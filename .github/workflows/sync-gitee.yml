name: Sync GitHub to Gitee

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

env:
  GITEE_REPOSITORY: Suzuran_1009/tudou-mod-manager

jobs:
  sync-repository:
    name: Sync branches and tags
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branches and tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::Missing the GITEE_TOKEN repository secret."
            exit 1
          fi

          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPOSITORY}.git"

          git for-each-ref --format='%(refname)' refs/remotes/origin/ |
            while IFS= read -r ref; do
              branch="${ref#refs/remotes/origin/}"
              if [ "${branch}" != "HEAD" ]; then
                git push --force gitee "${ref}:refs/heads/${branch}"
              fi
            done

          git push --force gitee 'refs/tags/*:refs/tags/*'

  sync-release:
    name: Sync GitHub release and assets
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: sync-repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-assets"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${RUNNER_TEMP}/release-assets" \
            --clobber

      - name: Create or update the matching Gitee release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::Missing the GITEE_TOKEN repository secret."
            exit 1
          fi

          api="https://gitee.com/api/v5/repos/${GITEE_REPOSITORY}"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          release_name="$(jq -r '.name // .tag_name' <<<"${release_json}")"
          release_body="$(jq -r '.body // ""' <<<"${release_json}")"
          prerelease="$(jq -r '.prerelease // false' <<<"${release_json}")"
          target_commitish="$(git rev-list -n 1 "${RELEASE_TAG}")"

          existing_file="${RUNNER_TEMP}/gitee-release.json"
          status="$(curl -sS -o "${existing_file}" -w '%{http_code}' \
            -G "${api}/releases/tags/${RELEASE_TAG}" \
            --data-urlencode "access_token=${GITEE_TOKEN}")"

          if [ "${status}" = "200" ]; then
            release_id="$(jq -r '.id' "${existing_file}")"
            curl --fail-with-body -sS -X PATCH "${api}/releases/${release_id}" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${RELEASE_TAG}" \
              --data-urlencode "name=${release_name}" \
              --data-urlencode "body=${release_body}" \
              --data-urlencode "prerelease=${prerelease}" \
              --data-urlencode "target_commitish=${target_commitish}" >/dev/null
          elif [ "${status}" = "404" ]; then
            created_file="${RUNNER_TEMP}/gitee-release-created.json"
            curl --fail-with-body -sS -X POST "${api}/releases" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${RELEASE_TAG}" \
              --data-urlencode "name=${release_name}" \
              --data-urlencode "body=${release_body}" \
              --data-urlencode "prerelease=${prerelease}" \
              --data-urlencode "target_commitish=${target_commitish}" >"${created_file}"
            release_id="$(jq -r '.id' "${created_file}")"
          else
            echo "::error::Could not inspect the Gitee release (HTTP ${status})."
            cat "${existing_file}"
            exit 1
          fi

          attachments="${RUNNER_TEMP}/gitee-attachments.json"
          curl --fail-with-body -sS -G "${api}/releases/${release_id}/attach_files" \
            --data-urlencode "access_token=${GITEE_TOKEN}" >"${attachments}"

          for asset in "${RUNNER_TEMP}"/release-assets/*; do
            [ -f "${asset}" ] || continue
            asset_name="$(basename "${asset}")"
            old_ids="$(jq -r --arg name "${asset_name}" '.[] | select(.name == $name) | .id' "${attachments}")"
            while IFS= read -r old_id; do
              [ -n "${old_id}" ] || continue
              curl --fail-with-body -sS -X DELETE \
                "${api}/releases/${release_id}/attach_files/${old_id}" \
                --data-urlencode "access_token=${GITEE_TOKEN}" >/dev/null
            done <<<"${old_ids}"

            curl --fail-with-body -sS -X POST \
              "${api}/releases/${release_id}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=${asset}" >/dev/null
          done
