name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install Pillow pyinstaller

      - name: Verify logging tests
        run: python -m unittest -v test_app_logging

      - name: Verify desktop launcher tests
        run: python -m unittest -v test_desktop_app

      - name: Verify game folder tests
        run: python -m unittest -v test_game_folder

      - name: Verify game executable discovery
        run: python -m unittest -v test_game_launch.GameLaunchTests.test_finds_game_executable_above_addons_directory

      - name: Verify direct game launch fallback
        run: python -m unittest -v test_game_launch.GameLaunchTests.test_launches_game_from_its_install_directory

      - name: Verify Steam launch preference
        run: python -m unittest -v test_game_launch.GameLaunchTests.test_prefers_steam_even_when_executable_exists

      - name: Verify Steam launch without executable
        run: python -m unittest -v test_game_launch.GameLaunchTests.test_falls_back_to_steam_when_executable_is_missing

      - name: Verify image and settings tests
        run: python -m unittest -v test_gif_to_vtf test_navigation_settings test_theme_settings

      - name: Verify update tests
        run: python -m unittest -v test_update

      - name: Verify VPK and spray tests
        run: python -m unittest -v test_vpk_detector

      - name: Build portable manager
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $icon = (Resolve-Path "assets/tudou-logo.ico").Path
          $logo = (Resolve-Path "assets/tudou-logo.png").Path
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "TudouManager-$env:GITHUB_REF_NAME" --icon $icon --add-data "${icon};assets" --add-data "${logo};assets" --distpath release --workpath build/release-work --specpath build/release-spec desktop_app.py

      - name: Build source update package
        shell: pwsh
        run: |
          $prefix = "tudou-mod-manager-$env:GITHUB_REF_NAME/"
          git archive --format=zip --prefix=$prefix --output "release/TudouManager-$env:GITHUB_REF_NAME-source.zip" HEAD

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @("release/TudouManager-$tag.exe", "release/TudouManager-$tag-source.zip")
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --title "土豆管理器 $tag" --notes "运行日志、诊断导出与 AI 日志分析。"
          }
